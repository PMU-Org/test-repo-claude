name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/loving-cerf-0wn0id
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No enablement input: creating a Pages site needs admin rights that
      # GITHUB_TOKEN does not have, so the site is enabled once in Settings
      # and this step just reads it.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is plain static files — no build step, the repo root is the site.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
